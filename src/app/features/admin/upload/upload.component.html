<div class="upload-container">
  <div class="upload-card">
    <h1>Upload Artwork</h1>

    <div 
      class="drop-zone"
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
    >
      <input 
        type="file" 
        id="fileInput" 
        multiple 
        accept="image/*"
        (change)="onFileSelected($event)"
        style="display: none"
      />
      <label for="fileInput" class="drop-label">
        <div class="icon">📁</div>
        <p>Drag & drop images here or click to browse</p>
      </label>
    </div>

    <div class="previews" *ngIf="filesWithMetadata.length > 0">
      <div class="preview-item" *ngFor="let fileData of filesWithMetadata; let i = index">
        <img [src]="fileData.preview" alt="Preview" />
        <button class="remove-btn" (click)="removeFile(i)">&times;</button>
        <div class="metadata-inputs">
          <input 
            type="text" 
            [(ngModel)]="fileData.title" 
            placeholder="Title"
            class="input-title"
          />
          <textarea 
            [(ngModel)]="fileData.description" 
            placeholder="Description"
            class="input-description"
            rows="2"
          ></textarea>
        </div>
      </div>
    </div>

    <div class="progress-bar" *ngIf="uploading">
      <div class="progress-fill" [style.width.%]="uploadProgress"></div>
    </div>

    <div class="message" *ngIf="message" [class.success]="message.includes('successful')">
      {{ message }}
    </div>

    <div class="actions">
      <button 
        class="btn-primary" 
        (click)="uploadFiles()"
        [disabled]="filesWithMetadata.length === 0 || uploading"
      >
        {{ uploading ? 'Uploading...' : 'Upload' }}
      </button>
      <button class="btn-secondary" routerLink="/admin/management">
        Cancel
      </button>
    </div>
  </div>
</div>
