<div class="not-found-container">

      <svg viewBox="0 0 100 100" class="icon-svg">
        <circle cx="50" cy="50" r="45" fill="none" stroke="#ff0000" stroke-width="2" />
        <text x="50" y="60" text-anchor="middle" class="error-text">404</text>
      </svg>
    </div>

    <!-- Main Error Message -->
